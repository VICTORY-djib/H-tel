<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>resteraut</title>

<style>
/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

/* BODY */
body{
    background:#f4f6fb;
    color:#0a1f44;
    line-height:1.8;
}

/* HEADER */
header{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(37, 99, 235, 0.75);
    backdrop-filter: blur(14px);
    padding:12px 24px;
    border-radius:40px;
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:0 8px 25px rgba(0,0,0,0.25);
    z-index:1000;
}

/* NAV */
nav{
    display:flex;
    align-items:center;
    gap:12px;
}

nav a{
   color:black;
    text-decoration:none;
    padding:9px 20px;
    border-radius:22px;
    font-size:14.5px;
    font-weight:600;
    transition:0.3s;
}

nav a:hover{
    background:rgba(255,255,255,0.25);
    transform:translateY(-2px);
}

nav a.active{
    background:white;
    color:#2563eb;
}

/* HAMBURGER */
.menu-toggle{
    display:none;
    font-size:30px;
    cursor:pointer;
    user-select:none;
    margin-right:10px;
}

/* HERO */
.hero{
    height:300px;
    background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url("hacker.png.PNG") center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:40px;
}

/* MAIN */
main{
    max-width:1200px;
    margin:110px auto 40px;
    padding:25px 20px;
    background:white;
    border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,0.1);
}

/* FOOTER */
footer{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

/* RESPONSIVE */
@media (max-width:768px){

    .menu-toggle{
        display:block;
    }

    nav{
        position:absolute;
        top:80px;
        left:50%;
        transform:translateX(-50%);
        flex-direction:column;
        background:rgba(37, 99, 235, 0.95);
        width:250px;
        padding:10px;
        border-radius:15px;
        display:none;
    }

    nav.active{
        display:flex;
    }

    nav a{
        text-align:center;
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="menu-toggle" id="menu-toggle">☰</div>

    <nav id="nav">
        <a href="index.html">HOME-Zaphir</a>
        <a class="active" href="cours.html">Menu-Zaphir</a>
        <a href="reseau.html">Menu-Zaphir Sélection</a>
    </nav>
</header>

<section class="hero">
    <h1>Best Food at special coffee</h1>
</section>

<main>
    <h2>Bienvenue 🍽️</h2>
    <p>
        Ce site est un exemple de restaurant moderne avec un design responsive.
        Il fonctionne sur PC, tablette et mobile.
    </p>
</main>

<footer>
    © 2026 - Zaphir Restaurant
</footer>

<script>
const toggle = document.getElementById("menu-toggle");
const nav = document.getElementById("nav");

toggle.addEventListener("click", () => {
    nav.classList.toggle("active");
});
</script>

</body>
</html>
